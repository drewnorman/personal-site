debug = true

logLevel = "ERROR"
InsecureSkipVerify = true
defaultEntryPoints = ["http"]

[web]
entryPoint = "traefik"
dashboard = true

[entryPoints]
  [entryPoints.http]
  address = ":80"

[docker]
endpoint = "unix:///var/run/docker.sock"
domain = "docker.localhost"
exposedByDefault = false
watch = true
