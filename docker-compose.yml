version: "3.7"

services:
  personal-site:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: personal-site
    volumes:
      - .:/app
    restart: always
    network_mode: host
  personal-site-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: personal-site-test
    volumes:
      - .:/app
    network_mode: host
