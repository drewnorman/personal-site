version: "3"

networks:
  local:
  traefik:
    external: true

services:
  site:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    command: >
      sh -lc "corepack enable
      && yarn install --frozen-lockfile
      && yarn dev --host 0.0.0.0 --port 4321"
    expose:
      - "4321"
    labels:
      - traefik.enable=true
      - traefik.http.services.personal-site-site.loadbalancer.server.port=4321
    networks:
      - local
      - traefik
    volumes:
      - .:/workspace:Z
      - node_modules:/workspace/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn

volumes:
  node_modules:
  yarn_cache:
