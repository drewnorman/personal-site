version: "3.3"

services:
  site:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    command: >
      sh -lc "corepack enable
      && yarn install --frozen-lockfile
      && yarn dev --host 0.0.0.0 --port 4321"
    expose:
      - "4321"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.port: "4321"
      traefik.frontend.rule: "Host:personal-site.localhost"
      traefik.http.routers.personal-site.rule: "Host(`personal-site.localhost`)"
      traefik.http.routers.personal-site.entrypoints: "http"
      traefik.http.services.personal-site.loadbalancer.server.port: "4321"
    networks:
      - traefik
    volumes:
      - .:/workspace:Z
      - node_modules:/workspace/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn

networks:
  traefik:
    external: true

volumes:
  node_modules:
  yarn_cache:
