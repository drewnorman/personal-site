steps:
  # Build and test the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME-$_ENV-$TAG_NAME',
      '-t', '$COMMIT_SHA',
      '-f', './Dockerfile',
      '.'
    ]
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME-$_ENV-$TAG_NAME']
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run',
      'deploy', '$REPO_NAME-$_ENV',
      '--image', 'us-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME-$_ENV-$TAG_NAME',
      '--region', '$_REGION',
      '--platform', 'managed',
      '--port', '3000',
      '--allow-unauthenticated'
    ]
images:
  - us-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME-$_ENV-$TAG_NAME
