name: Firebase Production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: adre-me

jobs:
  deploy:
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Ensure Firebase project
        run: |
          projects_json="$(yarn --silent firebase projects:list --json)"

          if PROJECTS_JSON="$projects_json" node -e "const data = JSON.parse(process.env.PROJECTS_JSON); process.exit((data.result || []).some((project) => project.projectId === process.env.PROJECT_ID) ? 0 : 1);"; then
            exit 0
          fi

          yarn firebase projects:addfirebase "${PROJECT_ID}" --non-interactive

      - name: Ensure production hosting site
        run: |
          set +e
          create_output="$(yarn firebase hosting:sites:create "${PROJECT_ID}" --project "${PROJECT_ID}" 2>&1)"
          create_status=$?
          set -e

          printf '%s\n' "$create_output"

          if [ "$create_status" -ne 0 ] && ! printf '%s\n' "$create_output" | grep -qi "already exists"; then
            exit "$create_status"
          fi

      - name: Deploy production hosting
        run: yarn firebase deploy --only hosting --project "${PROJECT_ID}"
