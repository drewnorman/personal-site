name: Firebase Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: adre-me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Ensure Firebase project
        run: |
          set +e
          add_output="$(yarn firebase projects:addfirebase "${PROJECT_ID}" --non-interactive 2>&1)"
          add_status=$?
          set -e

          printf '%s\n' "$add_output"

          if [ "$add_status" -ne 0 ] && ! printf '%s\n' "$add_output" | grep -Eqi "already|exists"; then
            exit "$add_status"
          fi

      - name: Ensure production hosting site
        run: |
          set +e
          create_output="$(yarn firebase hosting:sites:create "${PROJECT_ID}" --project "${PROJECT_ID}" 2>&1)"
          create_status=$?
          set -e

          printf '%s\n' "$create_output"

          if [ "$create_status" -ne 0 ] && ! printf '%s\n' "$create_output" | grep -qi "already exists"; then
            exit "$create_status"
          fi

      - name: Deploy production hosting
        run: yarn firebase deploy --only hosting --project "${PROJECT_ID}"
