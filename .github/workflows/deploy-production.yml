name: Deploy — Production

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: adre-me
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/adre-me/personal-site/personal-site

jobs:
  deploy:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.ref_name }} .
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy personal-site-production \
            --image ${{ env.IMAGE }}:${{ github.ref_name }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 3000 \
            --max-instances 1 \
            --allow-unauthenticated \
            --service-account cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
